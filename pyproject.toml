[project]
name = "google-trends-workspace"
version = "0.1.0"
description = "A local Chinese-language Google Trends research workspace"
requires-python = ">=3.11"
dependencies = ["fastapi==0.141.1", "uvicorn==0.53.0", "trendspyg[analysis]==1.8.0"]

[dependency-groups]
dev = ["pytest==9.1.1", "httpx==0.28.1"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "UP"]
